# Vrai GLPI 11.0.9 + MariaDB 11.4 (tags epingles, pas de latest flottant).
#   ./sirh glpi-real          demarre  -> http://127.0.0.1:8080  (glpi / glpi)
#   ./sirh glpi-real-keys     App-Token + api_token, ecrit GLPI_URL/GLPI_TOKEN/GLPI_PASSWORD dans ../.env
#   ./sirh glpi-real-stop     arrete (volumes conserves)
# Reinitialisation complete :
#   docker compose -f glpi/docker-compose.yml --env-file glpi/.env down -v
# Mots de passe : glpi/.env (genere au premier demarrage, hors git).

name: sirh-glpi

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=30
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${GLPI_DB_ROOT_PASSWORD:?absent de glpi/.env}
      MARIADB_DATABASE: glpi
      MARIADB_USER: glpi
      MARIADB_PASSWORD: ${GLPI_DB_PASSWORD:?absent de glpi/.env}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - 127.0.0.1:3307:3306
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 60

  glpi:
    image: glpi/glpi:11.0.9
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GLPI_DB_HOST: db
      GLPI_DB_PORT: 3306
      GLPI_DB_NAME: glpi
      GLPI_DB_USER: glpi
      GLPI_DB_PASSWORD: ${GLPI_DB_PASSWORD:?absent de glpi/.env}
      GLPI_TELEMETRY_URI: ""
    volumes:
      - glpi-data:/var/glpi
    ports:
      - 127.0.0.1:8080:80

volumes:
  db-data:
  glpi-data:
